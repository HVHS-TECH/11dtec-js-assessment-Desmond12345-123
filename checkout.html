<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tung Tung Donut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head">
    <div class="header-container">
        <a href="index.html"><img src="Troll Face Tung tung tung sahur.png" alt="Logo of tung tung tung sahur" class="Logo-tung-tung"></a>

        <h1 class="title" style="font-family: Cosmic Sans;">Tung Tung Donut</h1>
        <a href="checkout.html"><h2 class="checkout" style="font-family: Cosmic Sans;" onclick="goToCheckout()">Checkout</h2></a>


        <!-- Cart Button-->
         <a href="cart.html"><button class="cart-button" onclick="goToCart()"> 🛒</button></a>
    </div>
</header>
<div class="checkout-container">
    <h1>Checkout</h1>
    <p>Review your order and enter your details</p>

    <!-- your forms here -->

    <button onclick="printReceipt()">Print Receipt</button>
    <div id="receipt"></div>
</div>

<!--*************************************************************
  First and last name input forms start
**************************************************************-->
<div class="input-section">
    <label for="firstName">Enter your first name:</label>
    <input type="text" id="firstName">
    <button onclick="getFirstname()">Submit</button>
    <p id="firstNameError" class="error"></p>
</div>

<div class="input-section">
    <label for="lastName">Enter your last name:</label>
    <input type="text" id="lastName">
    <button onclick="getLastname()">Submit</button>
    <p id="lastNameError" class="error"></p>
</div>
<!--*************************************************************
  First and last name input forms end
**************************************************************-->

<div class="input-section">
    <label for="moneyAmount">Enter how much money you have:</label>
    <input type="number" id="moneyAmount" min="0" max="1000000000000" step="0.01">
</div>





<div id="receipt"></div>
<button onclick="printReceipt()">Print Receipt</button>



<script src="script.js"></script>




</body>
</html>
